syntax = "proto3";

// YAYai 跨端 gRPC 契约（唯一源，见 AGENTS.md R1/R5）
// 无 package 声明：Rust 端 include_proto!("agent")；Java 端由 java_package 定包名。
option java_multiple_files = true;
option java_package = "com.yaya.ai.proto";

// ── 桌面屏幕观察（R1 gRPC 核心协议） ─────────────────────
service ScreenObserver {
  rpc ObserveScreen(ObserveRequest) returns (ScreenTree);
}

message ObserveRequest {}

message Rect {
  int32 left = 1;
  int32 top = 2;
  int32 right = 3;
  int32 bottom = 4;
}

message ScreenNode {
  string id = 1;
  string text = 2;
  string class_name = 3;
  Rect bounds = 4;
  repeated ScreenNode children = 5;
}

message ScreenTree {
  string platform = 1; // windows / macos / linux
  ScreenNode root = 2;
  string error = 3; // 未启用 feature / 未实现时给明确原因（R3），禁止伪造数据
}

// ── 桌面动作执行 ─────────────────────────────────────────
service ActionExecutor {
  rpc Execute(Action) returns (ActionResult);
}

message Action {
  string type = 1; // click / input / scroll / swipe / launch
  string node_id = 2;
  string text = 3;
  Rect target = 4;
  string package_name = 5;
}

message ActionResult {
  bool success = 1;
  string error = 2;
}

// ── 桌面模型推理（流式 token） ──────────────────────────
service ModelBackend {
  rpc Generate(GenerateRequest) returns (stream Token);
}

message GenerateRequest {
  string prompt = 1;
  string model = 2;
  uint32 max_tokens = 3;
}

message Token {
  string text = 1;
  uint32 index = 2;
  bool done = 3;
  string stub_notice = 4; // 非空 = STUB 显式声明（R4），禁止伪装成功
}

// ── Agent Core：任务状态机（规范源 core/src/state.rs） ──
service AgentCore {
  rpc SubmitTask(TaskSpec) returns (stream TaskEvent);
  rpc GetStatus(StatusRequest) returns (AgentStatus);
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  IDLE = 1;
  PLANNING = 2;
  EXECUTING = 3;
  STREAMING = 4;
  DONE = 5;
  FAILED = 6;
}

message TaskSpec {
  string task_id = 1;
  string prompt = 2;
}

message TaskEvent {
  string task_id = 1;
  TaskState state = 2;
  string output = 3;
  string error = 4;
}

message StatusRequest {}

message AgentStatus {
  string platform = 1;
  bool automation_enabled = 2;
  bool model_stub = 3;
  string router_spec = 4;
}