[package]
name = "yaya-core"
version = "0.1.0"
edition = "2021"
description = "YAYai Agent Core：循环机 + 任务状态机 + 模型路由 + 工具层（唯一规范源，见 AGENTS.md R6）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# 云端 OpenAI 兼容后端（Android 经 JNI 使用）；单测默认关闭以保持轻量
cloud-http = ["dep:reqwest", "dep:tokio", "dep:futures"]

[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["json", "rustls-tls", "stream"]

[dependencies.tokio]
version = "1"
optional = true
features = ["rt", "time"]

[dependencies.futures]
version = "0.3"
optional = true