[package]
name = "yaya-agent-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.22"
