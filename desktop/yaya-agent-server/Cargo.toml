[package]
name = "yaya-agent-server"
version = "0.1.0"
edition = "2021"

[features]
default = []
# AGENTS.md R4：默认 STUB，--features full-llama 才编译 llama.cpp FFI 全量推理
full-llama = []
# AGENTS.md R3：macOS/Linux 分支默认不启用
macos-ax = []
linux-atspi = []

[dependencies]
yaya-core = { path = "../../core" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = "0.7"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"

[build-dependencies]
tonic-build = "0.12"
