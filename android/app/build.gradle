plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def llamaFull = project.findProperty("enableLlamaCpp")?.toString() == "true"

android {
    namespace "com.yaya.ai"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.yaya.ai"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        // 与 scripts/build-android.sh 产出的 ABI 对齐，避免出现部分 native 库缺失的切片。
        ndk {
            abiFilters += ['arm64-v8a', 'armeabi-v7a', 'x86_64']
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared", "-DLLAMA_ENABLE=${llamaFull ? 'ON' : 'OFF'}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            // CI 经 Secret 注入稳定 keystore（AIZIYOU466 配置 ANDROID_KEYSTORE_*），
            // 未配置时回退 debug 签名（本地开发），保证可覆盖安装需配置后构建。
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    signingConfigs {
        release {
            def kf = file("yaya-release.keystore")
            def storePass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def alias = System.getenv("ANDROID_KEY_ALIAS") ?: "yaya"
            def keyPass = System.getenv("ANDROID_KEY_PASSWORD")
            if (kf.exists() && storePass != null && keyPass != null) {
                storeFile kf
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }
}

// 交叉编译 Rust Agent Core → jniLibs（AGENTS.md R5/R6/R8）。
// 统一走 scripts/build-android.sh（直接用 NDK clang，无需 cargo-ndk）。
tasks.register("buildRustCore") {
    doLast {
        def so = file("src/main/jniLibs/arm64-v8a/libyaya_core_jni.so")
        if (so.exists()) {
            logger.lifecycle("jniLibs 已存在 libyaya_core_jni.so，跳过交叉编译")
            return
        }
        def ndk = System.getenv("ANDROID_NDK_HOME") ?: System.getenv("ANDROID_NDK_ROOT")
        if (ndk == null) {
            throw new GradleException("未设置 ANDROID_NDK_HOME/ANDROID_NDK_ROOT，Rust Core 交叉编译必须在构建前完成（参见 AGENTS.md R8）")
        }
        def pb = new ProcessBuilder("bash", "scripts/build-android.sh")
        pb.directory(file("../.."))
        pb.redirectErrorStream(true)
        pb.environment().put("ANDROID_NDK_HOME", ndk)
        def proc = pb.start()
        proc.inputStream.eachLine { logger.lifecycle("[rust] $it") }
        if (proc.waitFor() != 0) {
            throw new GradleException("Rust Core 交叉编译失败（参见 build-android.sh 输出）。APK 不含 .so 将无法运行 Agent。")
        }
    }
}

tasks.matching { it.name.toLowerCase().contains("nativelibs") }.configureEach {
    dependsOn("buildRustCore")
}

flutter {
    source "../.."
}
