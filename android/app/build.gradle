plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def llamaFull = project.findProperty("enableLlamaCpp")?.toString() == "true"

android {
    namespace "com.yaya.ai"
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.yaya.ai"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared", "-DLLAMA_ENABLE=${llamaFull ? 'ON' : 'OFF'}"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            // 临时使用 debug 签名，保证 CI 产物可直接侧载安装（正式发布再换正式 keystore）
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "io.grpc:grpc-okhttp:1.63.0"
    implementation "io.grpc:grpc-stub:1.63.0"
    implementation "io.grpc:grpc-protobuf:1.63.0"
    implementation "com.google.protobuf:protobuf-java:3.25.3"
    compileOnly "javax.annotation:javax.annotation-api:1.3.2"
}

flutter {
    source "../.."
}
