name: Build YAYai with llama.cpp (full inference)

# 任务 31：端侧推理落地——llama.cpp 全量编译验证（R4 UNVERIFIED → VERIFIED）。
# 手动触发；产出含全量端侧推理的 APK artifact。日常 push 构建不受影响（仍走 android-release.yml 的 STUB 路径）。

on:
  workflow_dispatch:

jobs:
  build-llama-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # llama.cpp 源码被 .gitignore 忽略（AGENTS.md R4），CI 里现拉。
      # 固定 tag 保证可复现。以 add_subdirectory 引入时 LLAMA_STANDALONE=OFF，
      # 自动只编 ggml+src（不编 common/examples/tools）；交叉编译时 GGML_NATIVE 自动 OFF。
      - name: Fetch llama.cpp source
        run: |
          LLAMA_TAG=b6310
          git clone --depth 1 --branch "${LLAMA_TAG}" https://github.com/ggml-org/llama.cpp.git \
            android/app/src/main/cpp/llama_cpp
          echo "llama.cpp ${LLAMA_TAG} -> $(du -sh android/app/src/main/cpp/llama_cpp | cut -f1)"

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build Rust Core for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build-android.sh

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/yaya-release.keystore
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS:-yaya}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "keystore restored"
          else
            echo "ANDROID_KEYSTORE_B64 未配置，使用 debug 签名"
          fi

      # 全量构建：仅编主流 arm64-v8a（真机目标）；-PenableLlamaCpp=true →
      # externalNativeBuild/cmake 启用，AGP 用 NDK 的 CMake 工具链交叉编译 llama.cpp。
      - name: Build APK (release, llama.cpp full, arm64)
        run: cd android && ./gradlew assembleRelease -PenableLlamaCpp=true -PabiFilters=arm64-v8a --console=plain

      - name: Upload release APK (llama full)
        uses: actions/upload-artifact@v4
        with:
          name: yayaai-apk-llama-full
          path: build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
